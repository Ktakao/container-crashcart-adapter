services:
  crashcart:
    build: .
    image: container-crashcart-adapter
    container_name: startech-crashcart
    network_mode: host
    environment:
      - DISPLAY=${DISPLAY}
      - XAUTHORITY=/root/.Xauthority
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${XAUTHORITY:-$HOME/.Xauthority}:/root/.Xauthority:ro
      - /dev/bus/usb:/dev/bus/usb
      - ./screenshots:/root/screenshots:Z
      - ./filetransfer:/root/filetransfer:Z
    device_cgroup_rules:
      - 'c 189:* rmw'
